services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    restart: unless-stopped

  paper-rag:
    build: .
    ports:
      - "8020:8020"
    volumes:
      - ./data:/data
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
    name: yuki_qdrant_storage
    external: true
  qdrant_snapshots:
    name: yuki_qdrant_snapshots
    external: true
