services:
  qdrant:
    image: qdrant/qdrant:latest
    # Qdrant is not exposed to the host network; paper-rag reaches it via the
    # internal docker network. Remove these port bindings if Qdrant needs to be
    # accessed from outside the container stack.
    # ports:
    #   - "127.0.0.1:6333:6333"
    #   - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    restart: unless-stopped

  paper-rag:
    build: .
    ports:
      # Bind only to loopback — access via SSH tunnel or a reverse proxy (#146).
      - "127.0.0.1:8020:8020"
    volumes:
      - ./data:/data
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
    name: yuki_qdrant_storage
    external: true
  qdrant_snapshots:
    name: yuki_qdrant_snapshots
    external: true
