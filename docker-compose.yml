services:
  qdrant:
    # Pinned tag + digest (#657). Bump via Dependabot (docker-compose ecosystem).
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    environment:
      # Qdrant API key auth (#657). Read from .env (never committed); must equal
      # QDRANT_API_KEY given to paper-rag. Compose fails fast if it is unset or empty.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
    # Qdrant is not exposed to the host network; paper-rag reaches it via the
    # internal docker network. Remove these port bindings if Qdrant needs to be
    # accessed from outside the container stack.
    # ports:
    #   - "127.0.0.1:6333:6333"
    #   - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    restart: unless-stopped

  paper-rag:
    build: .
    ports:
      # Bind only to loopback — access via SSH tunnel or a reverse proxy (#146).
      - "127.0.0.1:8020:8020"
    volumes:
      - ./data:/data
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - qdrant

# qdrant_storage/qdrant_snapshots are compose-managed named volumes by
# default (created automatically on first `docker compose up`). To reuse an
# existing external volume on a given host instead, add a
# docker-compose.override.yml (gitignored) with:
#
#   volumes:
#     qdrant_storage:
#       name: <existing-volume-name>
#       external: true
#     qdrant_snapshots:
#       name: <existing-volume-name>
#       external: true
volumes:
  qdrant_storage: {}
  qdrant_snapshots: {}
