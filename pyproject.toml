[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "academic-paper-system"
version = "0.1.0"
description = "Paper RAG system for academic paper processing and retrieval"
requires-python = ">=3.12"
authors = [
    {name = "dev-nodee", email = "yukihanajob2025@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
keywords = ["rag", "paper", "academic", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "pdfplumber>=0.11",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
    "qdrant-client>=1.9",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "google-genai>=1.0",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "prometheus-fastapi-instrumentator>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-cov>=4.1",
    "pytest-anyio>=0.0.0",
    "ruff>=0.4",
    "respx>=0.21",
    "fpdf2>=2.7",
]

[project.urls]
Homepage = "https://github.com/flipslidersand/academic-paper-system"
Repository = "https://github.com/flipslidersand/academic-paper-system.git"

[tool.hatch.build.targets.wheel]
packages = ["academic_paper"]

# Coverage flags live in CI (qa-workflows python-test passes --cov) — keeping
# them out of addopts avoids double --cov specs whose union polluted the
# measured set with tests/ and scripts/ (#147).
# Local coverage: pytest --cov=academic_paper --cov-report=html
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # line-too-long is handled by formatter

# CI passes --cov=. (source is then overridden), so omit is what actually
# keeps tests/ (inflating) and scripts/ (deflating) out of the denominator.
[tool.coverage.run]
branch = true
source = ["academic_paper"]
omit = ["tests/*", "scripts/*", ".venv/*", "htmlcov/*", "frontend/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
