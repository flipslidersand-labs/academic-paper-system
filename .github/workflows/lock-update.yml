name: Lock Update

# requirements.lock / requirements-dev.lock を週次で --upgrade し、差分があれば PR を作る (#521)。
# GITHUB_TOKEN で作った PR / push は CI を起動しないため、PR 作成後に
# `gh workflow run ci.yml` (workflow_dispatch) で CI を明示起動する。

on:
  schedule:
    - cron: "0 18 * * 0" # 月曜 03:00 JST
  workflow_dispatch:

concurrency:
  group: lock-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  BRANCH: chore/update-requirements-lock
  PIP_TOOLS_VERSION: "7.6.2"

jobs:
  update:
    runs-on: ${{ vars.GATE_RUNNER }}
    steps:
      # pip-compile が PyPI の依存を解決する間、書き込み権限のトークンを .git/config に残さない。
      # トークンは push のステップだけが、一時的な認証ヘッダーとして使う。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: pip install "pip-tools==${PIP_TOOLS_VERSION}"

      - name: Regenerate lock files
        run: scripts/update-lock.sh --upgrade

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- requirements.lock requirements-dev.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "lock files are up to date; no PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, push and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add requirements.lock requirements-dev.lock
          git commit -m "chore(deps): update requirements.lock and requirements-dev.lock"
          # persist-credentials: false のため、push だけ actions/checkout と同じ方式のヘッダーで認証する。
          # ヘッダーは引数でなく環境変数(GIT_CONFIG_*)で渡す: 引数だと push の間、ps で他ユーザーから読める。
          # URL は github.com 固定(GHES で動かすなら github.server_url から組み立てる)。
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH_HEADER}"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_HEADER}" \
            git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(deps): update requirements.lock and requirements-dev.lock" \
              --body "Weekly \`scripts/update-lock.sh --upgrade\` result (lock-update workflow). CI is started explicitly via workflow_dispatch because GITHUB_TOKEN-created PRs do not trigger workflows."
          fi

          # GITHUB_TOKEN の push は CI を起動しない。workflow_dispatch は例外的に起動できる。
          gh workflow run ci.yml --ref "$BRANCH"
