name: arXiv Daily Collect

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC = 09:00 JST
  workflow_dispatch:
    inputs:
      categories:
        description: "arXiv categories (space-separated)"
        default: "cs.AI cs.LG cs.CL"
        required: false
      max_results:
        description: "Max papers to fetch per source"
        default: "20"
        required: false
      api_url:
        description: "API base URL"
        default: "http://localhost:8020"
        required: false
      summarize:
        description: "Run bulk summarization after collection (true/false)"
        default: "true"
        required: false
      from_date:
        description: "PubMed --from-date override (YYYY-MM-DD; empty = yesterday)"
        default: ""
        required: false
      until_date:
        description: "PubMed --until-date override (YYYY-MM-DD; empty = today)"
        default: ""
        required: false

jobs:
  collect:
    # Runs on MINIPC self-hosted runner which has access to localhost:8020.
    # To register the runner: Settings > Actions > Runners > New self-hosted runner
    # and add the label "minipc" to the runner.
    runs-on: [self-hosted, minipc]
    timeout-minutes: 60

    # Dispatch inputs are passed exclusively through env so user-controlled
    # values never get template-expanded into run scripts (script injection
    # on the self-hosted runner, #135). Defaults live here, in one place.
    env:
      API_URL: ${{ github.event.inputs.api_url || 'http://localhost:8020' }}
      CATEGORIES: ${{ github.event.inputs.categories || 'cs.AI cs.LG cs.CL' }}
      MAX_RESULTS: ${{ github.event.inputs.max_results || '20' }}
      # Write-endpoint auth (#183). ingest_client reads this env; curl steps
      # pass it as X-API-Key. Empty when the secret is unset — the server then
      # runs with auth disabled and ignores the header.
      PAPER_API_KEY: ${{ secrets.PAPER_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx

      - name: Wait for API health
        run: |
          echo "Checking $API_URL/health ..."
          # Single-quoted so the inner bash expands $API_URL itself — the outer
          # shell never splices the value into the command string.
          timeout 30 bash -c 'until curl -sf "$API_URL/health" > /dev/null; do sleep 3; done'
          echo "API is healthy"

      - name: Collect arXiv papers
        run: |
          # $CATEGORIES is intentionally unquoted: space-separated list → argv
          python scripts/arxiv_collect.py \
            --categories $CATEGORIES \
            --max "$MAX_RESULTS" \
            --api-url "$API_URL" \
            --summary-file summary-arxiv.json

      - name: Collect Semantic Scholar papers
        continue-on-error: true
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          python scripts/semantic_scholar_collect.py \
            --topics "machine learning" "deep learning" "natural language processing" \
            --max "$MAX_RESULTS" \
            --api-url "$API_URL" \
            --summary-file summary-s2.json \
            ${SEMANTIC_SCHOLAR_API_KEY:+--api-key "$SEMANTIC_SCHOLAR_API_KEY"}

      - name: Collect PubMed papers
        continue-on-error: true
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          # Yesterday's date in YYYY-MM-DD — filters to papers published in the
          # last 24 hours so cron runs stay incremental (#197).
          PUBMED_FROM_DATE: ${{ github.event.inputs.from_date || '' }}
          PUBMED_UNTIL_DATE: ${{ github.event.inputs.until_date || '' }}
        run: |
          # Compute yesterday as the default from-date when no override is given.
          FROM_DATE="${PUBMED_FROM_DATE:-$(date -u -d 'yesterday' '+%Y-%m-%d' 2>/dev/null || date -u -v-1d '+%Y-%m-%d')}"
          UNTIL_DATE="${PUBMED_UNTIL_DATE:-$(date -u '+%Y-%m-%d')}"
          python scripts/pubmed_collect.py \
            --terms "artificial intelligence" "machine learning" \
            --max 5 \
            --api-url "$API_URL" \
            --from-date "$FROM_DATE" \
            --until-date "$UNTIL_DATE" \
            --summary-file summary-pubmed.json \
            ${NCBI_API_KEY:+--api-key "$NCBI_API_KEY"}

      - name: Collect OpenAlex papers
        continue-on-error: true
        run: |
          python scripts/openalex_collect.py \
            --query "large language model retrieval augmented generation" \
            --max "$MAX_RESULTS" \
            --api-url "$API_URL" \
            --summary-file summary-openalex.json

      # The S2 / PubMed / OpenAlex steps are continue-on-error, so a permanently broken
      # collector would keep the workflow green forever. This gate fails when a
      # summary file is missing (script crashed before writing) or every fetched
      # paper failed to ingest. A fetch_error alone (e.g. keyless S2 rate limit)
      # only warns (#151).
      - name: Verify collector results
        run: |
          python3 - <<'EOF'
          import json, sys

          problems = []
          for name, path in [
              ("semantic-scholar", "summary-s2.json"),
              ("pubmed", "summary-pubmed.json"),
              ("openalex", "summary-openalex.json"),
          ]:
              try:
                  with open(path) as f:
                      s = json.load(f)
              except FileNotFoundError:
                  problems.append(f"{name}: summary file missing — script crashed before writing it")
                  continue
              fetched = s.get("fetched", 0)
              ok = s.get("ingested", 0) + s.get("duplicate", 0)
              if s.get("fetch_error") and fetched == 0:
                  print(f"WARN {name}: search API failed ({s['fetch_error']}) — no papers this run")
              elif fetched > 0 and ok == 0 and s.get("failed", 0) > 0:
                  problems.append(f"{name}: all {fetched} fetched papers failed to ingest")

          if problems:
              print("Collector health check failed:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print("Collector results OK")
          EOF

      - name: Trigger bulk summarization
        if: ${{ github.event.inputs.summarize != 'false' }}
        run: |
          set -euo pipefail

          # POST /jobs/summarize-all — capture HTTP status and body separately
          HTTP_CODE=$(curl -s -o /tmp/job_response.json -w "%{http_code}" \
            ${PAPER_API_KEY:+-H "X-API-Key: $PAPER_API_KEY"} \
            -X POST "$API_URL/jobs/summarize-all")

          if [ "$HTTP_CODE" = "202" ]; then
            JOB_ID=$(python3 -c "import json; print(json.load(open('/tmp/job_response.json'))['job_id'])")
            echo "Summarize job started: $JOB_ID"

            # Poll until done or timeout (5 minutes). A transient curl/parse
            # failure keeps the previous STATUS and counts toward a retry
            # budget; 5 consecutive failures abort the step (#141).
            STATUS="pending"
            POLL_FAILS=0
            DEADLINE=$((SECONDS + 300))
            while [ $SECONDS -lt $DEADLINE ]; do
              if POLLED=$(curl -sf "$API_URL/jobs/$JOB_ID" \
                | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])" 2>/dev/null); then
                POLL_FAILS=0
                STATUS="$POLLED"
                echo "Job status: $STATUS"
                if [ "$STATUS" = "done" ] || [ "$STATUS" = "failed" ]; then
                  break
                fi
              else
                POLL_FAILS=$((POLL_FAILS + 1))
                echo "Warning: poll failed ($POLL_FAILS/5)"
                if [ "$POLL_FAILS" -ge 5 ]; then
                  echo "Polling failed 5 times in a row — aborting"
                  echo '{"status":"poll-error","processed":0,"failed":0}' > summarize-result.json
                  exit 1
                fi
              fi
              sleep 10
            done

            # Save and print final job details
            curl -sf "$API_URL/jobs/$JOB_ID" > summarize-result.json 2>/dev/null \
              || echo '{"status":"unknown","processed":0,"failed":0}' > summarize-result.json
            echo "=== Final job details ==="
            python3 -m json.tool < summarize-result.json || true

            if [ "$STATUS" = "failed" ]; then
              echo "Summarize job failed"
              exit 1
            fi
            if [ "$STATUS" != "done" ]; then
              echo "Summarize job did not finish within the 5-minute deadline (status: $STATUS)"
              exit 1
            fi

          elif [ "$HTTP_CODE" = "409" ]; then
            echo "Warning: A summarize job is already running — skipping"
            echo '{"status":"skipped","processed":0,"failed":0}' > summarize-result.json
          elif [ "$HTTP_CODE" = "503" ]; then
            echo "Warning: LLM not configured — skipping summarization"
            echo '{"status":"no-llm","processed":0,"failed":0}' > summarize-result.json
          else
            echo "Unexpected response from /jobs/summarize-all: HTTP $HTTP_CODE"
            cat /tmp/job_response.json
            echo '{"status":"error","processed":0,"failed":0}' > summarize-result.json
            exit 1
          fi

      - name: Score papers
        run: |
          HTTP_CODE=$(curl -s -o /tmp/score_response.json -w "%{http_code}" \
            ${PAPER_API_KEY:+-H "X-API-Key: $PAPER_API_KEY"} \
            -X POST "$API_URL/papers/score-all")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "=== Score results ==="
            cat /tmp/score_response.json | python3 -m json.tool
          else
            echo "Warning: scoring failed (HTTP $HTTP_CODE) — continuing"
          fi

      - name: Upload run summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collect-summaries-${{ github.run_number }}
          path: |
            summary-arxiv.json
            summary-s2.json
            summary-pubmed.json
            summary-openalex.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          import urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "")
          if not webhook_url:
              print("DISCORD_WEBHOOK_URL not set, skipping")
              sys.exit(0)

          def load_summary(path):
              try:
                  with open(path) as f:
                      return json.load(f)
              except FileNotFoundError:
                  return {}

          arxiv = load_summary("summary-arxiv.json")
          s2 = load_summary("summary-s2.json")
          pubmed = load_summary("summary-pubmed.json")
          openalex = load_summary("summary-openalex.json")
          summ = load_summary("summarize-result.json")

          score_info = {}
          try:
              with open("/tmp/score_response.json") as f:
                  score_info = json.load(f)
          except FileNotFoundError:
              pass

          def fmt(d):
              i = d.get("ingested", "-")
              dup = d.get("duplicate", "-")
              fail = d.get("failed", "-")
              return f"新規:{i} / 重複:{dup} / 失敗:{fail}"

          s_status = summ.get("status", "-")
          scored = score_info.get("scored", "-")

          job_status = os.environ.get("JOB_STATUS", "success")
          ok = job_status == "success"
          color = 0x00b894 if ok else 0xe17055

          embed = {
              "title": "\U0001f9e0 Daily Collect",
              "color": color,
              "fields": [
                  {"name": "arXiv", "value": fmt(arxiv), "inline": False},
                  {"name": "Semantic Scholar", "value": fmt(s2), "inline": False},
                  {"name": "PubMed", "value": fmt(pubmed), "inline": False},
                  {"name": "OpenAlex", "value": fmt(openalex), "inline": False},
                  {
                      "name": "\U0001f52c 要約ジョブ",
                      "value": f"処理:{summ.get('processed','-')} / 失敗:{summ.get('failed','-')} / {s_status}",
                      "inline": False,
                  },
                  {
                      "name": "⭐ スコアリング",
                      "value": f"更新: {scored} 件",
                      "inline": False,
                  },
              ],
              "footer": {"text": "flipslidersand/academic-paper-system"},
          }

          payload = json.dumps({"embeds": [embed]}).encode()
          req = urllib.request.Request(
              webhook_url,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=10) as resp:
              print(f"Discord notified: HTTP {resp.status}")
          EOF
