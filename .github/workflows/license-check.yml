name: License Check

# #385: pyproject.toml declares MIT, so copyleft packages must not slip into the
# runtime dependency set unnoticed. Separate workflow (not ci.yml) to stay out of
# the way of concurrent edits to ci.yml.
#
# - runtime: requirements.lock (what the Docker image ships) is checked against a
#   permissive allow-list; the only exception is certifi (MPL-2.0, unmodified CA data
#   file), passed via --ignore-packages so any other MPL-2.0 dependency fails the job (#831).
# - dev: requirements-dev.lock (the pinned set CI actually tests with) is checked against
#   the same list; exceptions are certifi (above) and fpdf2 (LGPL-3.0, test-PDF
#   generation only, never shipped — see README "License") (#835).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - requirements.lock
      - requirements-dev.lock
      - .github/workflows/license-check.yml

concurrency:
  group: license-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_LICENSES_VERSION: "5.5.5"

jobs:
  licenses:
    # Pure-Python job (no docker socket needed), so follow the org-wide runner var
    # with an ubuntu-latest fallback, same resolution as qa-workflows python-test.yml.
    runs-on: ${{ vars.GATE_RUNNER }}
    timeout-minutes: 15
    env:
      # Substring match (pip-licenses --partial-match) against the License field /
      # classifiers, which are free-form (e.g. "BSD License", "Apache Software License").
      # MPL-2.0 is deliberately NOT listed: certifi is exempted per-package with
      # --ignore-packages below, so a new MPL-2.0 dependency fails instead of passing silently.
      ALLOWED: "MIT;BSD;Apache;ISC;0BSD;Zlib;CC0;Unlicense;Python Software Foundation;PSF"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install pip-licenses
        run: python -m pip install --quiet "pip-licenses==${PIP_LICENSES_VERSION}"

      - name: Runtime dependencies (requirements.lock) — certifi MPL-2.0 exception only
        run: |
          python -m venv "$RUNNER_TEMP/rt"
          "$RUNNER_TEMP/rt/bin/pip" install --quiet --require-hashes -r requirements.lock
          pip-licenses --python "$RUNNER_TEMP/rt/bin/python" --format=markdown
          pip-licenses --python "$RUNNER_TEMP/rt/bin/python" --partial-match \
            --ignore-packages certifi \
            --allow-only="$ALLOWED"

      - name: Dev dependencies (requirements-dev.lock) — certifi MPL-2.0 and fpdf2 LGPL exceptions only
        run: |
          python -m venv "$RUNNER_TEMP/dev"
          "$RUNNER_TEMP/dev/bin/pip" install --quiet --require-hashes -r requirements-dev.lock
          pip-licenses --python "$RUNNER_TEMP/dev/bin/python" --format=markdown
          pip-licenses --python "$RUNNER_TEMP/dev/bin/python" --partial-match \
            --ignore-packages certifi fpdf2 \
            --allow-only="$ALLOWED"
