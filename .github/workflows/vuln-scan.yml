name: Vulnerability Scan

# #350: dependency CVE scan (pip-audit) + Docker image scan (Trivy).
# Separate workflow (not ci.yml) so it doesn't collide with concurrent ci.yml edits.
#
# Mode: WARN-ONLY until VULN_SCAN_ENFORCE=true is set (repo/org variable; no code change).
# Baseline as of 2026-11-01: pip-audit 0 findings (#798), Trivy 0 fixable CRITICAL/HIGH
# (#799), so enforcing no longer turns every PR red. To enforce (#733): set the variable,
# then add pip-audit / trivy-image to the required checks of the main ruleset (#427).
# New findings after that fail the job; a CVE with no fix yet is skipped by
# --ignore-unfixed, and an accepted fixable one goes in .trivyignore with a dated reason.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly: new CVEs appear without any commit
  workflow_dispatch:

concurrency:
  group: vuln-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_AUDIT_VERSION: "2.10.1"
  TRIVY_IMAGE: aquasec/trivy:0.75.0

jobs:
  pip-audit:
    # Pure-Python job: follow the org runner var, same resolution as qa-workflows python-test.yml.
    runs-on: ${{ vars.GATE_RUNNER }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --quiet "pip-audit==${PIP_AUDIT_VERSION}"
      - name: Audit requirements.lock
        # Step-level continue-on-error (NOT job-level): a job-level one keeps the
        # job's check run red even though the workflow run passes. At step level
        # the job concludes success; findings stay in the log. Enforced when
        # VULN_SCAN_ENFORCE=true.
        continue-on-error: ${{ vars.VULN_SCAN_ENFORCE != 'true' }}
        # requirements.lock is fully hash-pinned, so pip-audit does not need to
        # resolve anything (no install, no network except the vuln DB).
        run: pip-audit --require-hashes --disable-pip -r requirements.lock

  trivy-image:
    # `docker build` needs a docker socket, which linux-general (ARC) lacks —
    # keep ubuntu-latest, same constraint as ci.yml's docker-build job.
    runs-on: ${{ vars.GATE_RUNNER }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build Docker image
        run: docker build -t academic-paper-system:scan .
      - name: Trivy image scan (CRITICAL/HIGH, fixable only)
        # Step-level warn-only, see pip-audit job.
        continue-on-error: ${{ vars.VULN_SCAN_ENFORCE != 'true' }}
        # Trivy is run from its pinned official image instead of a third-party
        # action. --ignore-unfixed skips CVEs with no available fix.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 1 academic-paper-system:scan
