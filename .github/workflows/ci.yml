name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Pinned to a SHA (not @main) so upstream workflow changes can't silently
    # alter this repo's gate; bump deliberately (#147).
    uses: flipslidersand-labs/qa-workflows/.github/workflows/python-test.yml@fcccf3f5895340faa5c6ef2469068b7b32a6c60e
    with:
      # scripts/ は academic_paper と合算計測される (pyproject.toml
      # [tool.coverage.run] source, #240)。合算実測は約76%。実測との差が
      # 最低3〜5pt空くように71に設定 (#268)。次にscripts/が増えて実測が
      # 動く際も、この差を割らないよう閾値を追随させること。
      coverage-threshold: 71
      # Pin ruff so an upstream ruff release can't break lint mid-PR.
      ruff-version: "0.16.2"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t academic-paper-system:test .
      - name: Smoke test image (#263)
        run: |
          set -euo pipefail
          # EMBEDDING_SVC_URL/QDRANT_URL default to a "<internal-host>" placeholder
          # that Settings' reject_placeholder validator rejects at startup, so real
          # (if unreachable) values are required just to let the process come up.
          # ACADEMIC_DB defaults to /data/academic.db, which only exists when a
          # volume is mounted (docker-compose); point it at a writable path here.
          docker run -d --name smoke -p 8020:8020 \
            -e EMBEDDING_SVC_URL=http://localhost:9092 \
            -e QDRANT_URL=http://localhost:6333 \
            -e ACADEMIC_DB=/tmp/academic.db \
            academic-paper-system:test

          ready=""
          for _ in $(seq 1 15); do
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "Container exited during startup" >&2
              break
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8020/health || echo 000)
            # 200 (healthy) or 503 (Qdrant/embedding-svc unreachable, expected in CI)
            # both prove the process started and is serving; only a non-response
            # (startup crash, wrong CMD args, etc.) should fail the job.
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ -z "$ready" ]; then
            echo "Container did not become ready; logs:" >&2
            docker logs smoke || true
            exit 1
          fi
          echo "Smoke test OK (/health responded)"
      - name: Clean up smoke container
        if: always()
        run: docker rm -f smoke || true

  gitleaks:
    permissions:
      contents: read
    uses: flipslidersand-labs/qa-workflows/.github/workflows/gitleaks.yml@main
