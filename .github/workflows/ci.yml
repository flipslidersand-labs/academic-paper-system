name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Pinned to a SHA (not @main) so upstream workflow changes can't silently
    # alter this repo's gate; bump deliberately (#147).
    uses: flipslidersand-labs/qa-workflows/.github/workflows/python-test.yml@fcccf3f5895340faa5c6ef2469068b7b32a6c60e
    with:
      # Measured academic_paper coverage is ~90.5% with tests/ and scripts/
      # omitted (pyproject [tool.coverage.run] omit); 90 tracks actual coverage
      # with a 0.5pt margin (raised from 88, #199).
      coverage-threshold: 90
      # Pin ruff so an upstream ruff release can't break lint mid-PR.
      ruff-version: "0.16.2"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t academic-paper-system:test .
