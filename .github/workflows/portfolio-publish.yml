name: Portfolio Publish

on:
  schedule:
    - cron: "0 1 * * 0" # 10:00 JST Sunday
  workflow_dispatch:

jobs:
  publish:
    runs-on: [self-hosted, minipc]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Read-endpoint auth (#241/#418). generate_portfolio.py's fetch_all()
      # reads this and sends it as X-API-Key; empty when the secret is unset,
      # matching arxiv-daily.yml's PAPER_API_KEY convention.
      PAPER_API_KEY: ${{ secrets.PAPER_API_KEY }}

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # minipc's persistent self-hosted runner has no bare `python` on PATH
      # (only python3), so this step must resolve one before the next step
      # can run (#428 — 6 consecutive weekly runs failed with "python:
      # command not found" here without ever reaching Generate portfolio).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for API
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:8020/health > /dev/null; do sleep 3; done'
          echo "API ready"

      - name: Generate portfolio
        run: python scripts/generate_portfolio.py --api-url http://localhost:8020 --output-dir docs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Persistent self-hosted runner: clean up any rebase left over from
          # a previous failed run before doing anything else (#380).
          git rebase --abort 2>/dev/null || true
          git add docs/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update portfolio [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push failed (attempt $i), fetching and rebasing..."
            git fetch origin
            if ! git rebase origin/main; then
              echo "rebase failed (attempt $i), aborting to avoid leaving the worktree mid-rebase" >&2
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done
          echo "push failed after retries" >&2
          exit 1
